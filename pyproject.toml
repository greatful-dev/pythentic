[tool.poetry]
name = "pythentic"
version = "0.1.0"
description = "python agentic template"
authors = ["Mark Brewer <markweldonbrewer@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = ">=0.115.8,<0.116.0"
uvicorn = ">=0.34.0,<0.35.0"
pydantic = ">=2.12.3,<3.0.0"
fastmcp = ">=2.12.5,<3.0.0"
ollama = "^0.6.1"
yfinance = "^1.0"
openpyxl = "^3.1.5"
pandas = "^2.3.3"
langchain = "^1.2.17"
langchain-mcp-adapters = "^0.2.2"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
pylint = "^4.0.2"
black = "^25.9.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"