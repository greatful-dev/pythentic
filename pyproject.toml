[project]
name = "pythentic"
version = "0.1.0"
description = "python agentic template"
authors = [{ name = "Mark Brewer", email = "markweldonbrewer@gmail.com" }]
requires-python = ">=3.10,<4.0"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115.8,<0.116.0",
    "uvicorn>=0.34.0,<0.35.0",
    "pydantic>=2.12.3,<3.0.0",
    "fastmcp>=2.12.5,<3.0.0",
    "ollama>=0.6.1,<0.7",
    "yfinance>=1.0,<2",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.3.3,<3",
    "langchain>=1.2.17,<2",
    "langchain-mcp-adapters>=0.2.2,<0.3",
]

[dependency-groups]
dev = [
    "pytest>=7.0,<8",
    "pylint>=4.0.2,<5",
    "black>=25.9.0,<26",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
